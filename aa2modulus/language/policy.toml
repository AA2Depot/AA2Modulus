# ---------------------------------------------------------------------------
# Readable: expressions declared with the wrong native type that the formatter
# may still write by name. Loading fails once the declaration is fixed.
[readable]
expressions = ["int:100"]  # declared bool natively

# ---------------------------------------------------------------------------
# Defects: targets that do not work in AAUnlimited; every use reports
# NATIVE_DEFECTIVE_EXPRESSION. `declared` = registry parameter types; loading
# fails when the registry changes, so the entry gets reviewed. Evidence:
# docs/native-format.md N12.
[defects.expressions]
"string:13" = { declared = ["int", "int", "int", "string"], reason = "its first parameter is declared int, but Thread::StringReplace reads it as a string, so trigger initialization rejects a string argument and an int argument is read as a string pointer" }

# ---------------------------------------------------------------------------
# Event values: expressions that return event data only in some events.
# <type> = [event IDs] giving that value type; `otherwise` = value in all other
# events. `callback` must match the registry, so a change forces a review.
# Evidence: docs/native-format.md N6, N7, N11.
[event_values.expressions]
# Conversation.IsAnswering: int in events 13, 15; bool in 14, 19
"int:70" = { callback = "Thread::GetConversationCurrentlyAnswering", int = [13, 15], bool = [14, 19], otherwise = 0 }
# Context.NpcOriginalResponse / NpcCurrentResponse: int in NPC_RESPONSE (8)
"int:100" = { callback = "Thread::GetNpcResponseOriginalAnswer", int = [8], otherwise = false }
"int:101" = { callback = "Thread::GetNpcResponseCurrentAnswer", int = [8], otherwise = false }

