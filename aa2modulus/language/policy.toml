# aa2modulus language policy: the hand-picked parts of the source language
# (names, operators, defaults). Native facts such as signatures come from the
# generated registry in ../metadata/registry/; every entry here is checked
# against it on load. Details: docs/metadata.md.
#
# Target keys:
#   actions, events                  108
#   expressions, named constants     "int:24"  (type:id; int, bool, float, string, invalid)
#
# Naming:
#   card-first targets are members   coach.SetVirtue(3), coach.Virtue  (see [members])
#   everything else is Root.Name     Globals.CurrentDay, Text.Length(s)
#   constants                        Constants.Day.MONDAY
#   events keep native symbols       on CARD_ADDED;
#   Roots start uppercase. Getters are nouns (Virtue), setters Set + noun
#   (SetVirtue), booleans Has/Is (HasGlasses). Overload only by parameter type.

# Source language version; raise it when the meaning of source changes.
# This is the only copy: never repeat the number in code, tests or docs.
language_version = 1

# Built-in names source cannot shadow; a quoted variable("ThisCard") is still
# allowed. Each must name a zero-argument expression.
protected_names = ["ThisCard", "TriggeringCard"]

# Native-hazard codes that `@allow(CODE)` may turn from an error into a warning.
acknowledgeable = [
  "REVIEWED_VALUE_TYPE_MISMATCH",               # event-dependent callback value read with the wrong type
  "NATIVE_DEFECTIVE_EXPRESSION",                # [defects] target that cannot work natively
  "EXPRESSION_METADATA_RETURN_TYPE_MISMATCH",   # INT/100: native declaration disagrees with its scope
]

# ---------------------------------------------------------------------------
# Operators: token = native expressions, one per operand type.
# Precedence and associativity are fixed by the grammar.
[operators]
"||" = ["bool:5"]                           # Logical Or (native short-circuit)
"&&" = ["bool:4"]                           # Logical And (native short-circuit)
"==" = ["bool:8", "bool:12", "bool:20"]
"!=" = ["bool:13", "bool:23"]
"<"  = ["bool:10", "bool:22"]
"<=" = ["bool:9", "bool:21"]
">"  = ["bool:6", "bool:18"]
">=" = ["bool:7", "bool:19"]
"+"  = ["int:5", "float:5", "string:8"]     # string + string concatenates
"-"  = ["int:6", "float:6"]
"*"  = ["int:8", "float:8"]
"/"  = ["int:7", "float:7"]
"!"  = ["bool:11"]                          # prefix Not

# ---------------------------------------------------------------------------
# Defaults for trailing action arguments: <slot> = value (type must match).
# Notification("hi") means Notification("hi", false).
[action_defaults.108]  # Notification
1 = false

